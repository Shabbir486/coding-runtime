global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: coderuntime

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8002
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: api-gateway

  - job_name: queue-manager
    dns_sd_configs:
      - names: ["queue-manager"]
        type: A
        port: 8083
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: queue-manager

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8085
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: worker
