apiVersion: v2
name: coderuntime
description: >
  A production-grade distributed code execution platform that safely runs
  user-submitted code in sandboxed Docker containers across multiple languages.

type: application

# Chart version — bump on any chart change
version: 1.0.0

# Application version
appVersion: "1.0.0"

keywords:
  - code-execution
  - sandbox
  - golang
  - distributed
  - kubernetes

home: https://github.com/coderuntime/coderuntime

sources:
  - https://github.com/coderuntime/coderuntime

maintainers:
  - name: coderuntime
    email: ops@coderuntime.io
    url: https://coderuntime.io

annotations:
  category: Developer Tools
  licenses: Apache-2.0
  images: |
    - name: api-gateway
      image: ghcr.io/coderuntime/api-gateway:1.0.0
    - name: worker
      image: ghcr.io/coderuntime/worker:1.0.0

dependencies:
  - name: postgresql
    version: "15.5.38"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    tags:
      - database

  - name: redis
    version: "20.3.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    tags:
      - cache

  - name: nats
    version: "1.2.6"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
    tags:
      - messaging

  - name: prometheus
    version: "25.27.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
    tags:
      - monitoring

  - name: grafana
    version: "8.6.4"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
    tags:
      - monitoring
