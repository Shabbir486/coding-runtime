{{/*
  Helm deployment template for coderuntime services.
  Renders both the API gateway and worker deployments
  based on values.yaml configuration.
*/}}

{{- if .Values.api.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coderuntime.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "coderuntime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "coderuntime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "coderuntime.serviceAccountName" . }}-api
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.api.securityContext | nindent 8 }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "coderuntime.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "coderuntime.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "coderuntime.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: api
              topologyKey: kubernetes.io/hostname
        {{- with .Values.api.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: 60

      containers:
        - name: api-gateway
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.config.serverPort | default 8002 }}
              protocol: TCP

          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}

          envFrom:
            - configMapRef:
                name: {{ include "coderuntime.fullname" . }}-common-config
            - configMapRef:
                name: {{ include "coderuntime.fullname" . }}-api-config

          # Env var names are prefixed with CODERUNTIME_ so Viper (the binary
          # uses SetEnvPrefix("CODERUNTIME")) actually picks them up. Secret
          # data keys keep their short names.
          env:
            - name: CODERUNTIME_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-api-secrets
                  key: DATABASE_HOST
            - name: CODERUNTIME_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-api-secrets
                  key: DATABASE_USER
            - name: CODERUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-api-secrets
                  key: DATABASE_PASSWORD
            - name: CODERUNTIME_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-api-secrets
                  key: REDIS_HOST
            - name: CODERUNTIME_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-api-secrets
                  key: REDIS_PASSWORD
            - name: CODERUNTIME_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-api-secrets
                  key: JWT_SECRET
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 15

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coderuntime.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "coderuntime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "coderuntime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "coderuntime.serviceAccountName" . }}-worker
      automountServiceAccountToken: false
      priorityClassName: worker-priority

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- /* dockerGroupGid is rendered as supplementalGroups so the worker
               UID can write to /var/run/docker.sock. */ -}}
        {{- $sc := omit .Values.worker.securityContext "dockerGroupGid" }}
        {{- toYaml $sc | nindent 8 }}
        {{- if .Values.worker.volumes.dockerSocket.enabled }}
        supplementalGroups:
          - {{ .Values.worker.securityContext.dockerGroupGid | default 999 }}
        {{- end }}

      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: 120

      initContainers:
        - name: init-sandbox
          image: busybox:1.36-musl
          command:
            - sh
            - -c
            - |
              mkdir -p {{ .Values.worker.config.sandboxBaseDir }}
              chmod 1777 {{ .Values.worker.config.sandboxBaseDir }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
          {{- if .Values.worker.volumes.sandbox.enabled }}
          volumeMounts:
            - name: sandbox
              mountPath: {{ .Values.worker.config.sandboxBaseDir }}
          {{- end }}

      containers:
        - name: worker
          image: {{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP

          securityContext:
            {{- toYaml .Values.worker.containerSecurityContext | nindent 12 }}

          envFrom:
            - configMapRef:
                name: {{ include "coderuntime.fullname" . }}-common-config
            - configMapRef:
                name: {{ include "coderuntime.fullname" . }}-worker-config

          # Env var names are prefixed with CODERUNTIME_ for Viper.
          env:
            - name: CODERUNTIME_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-worker-secrets
                  key: DATABASE_HOST
            - name: CODERUNTIME_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-worker-secrets
                  key: DATABASE_USER
            - name: CODERUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-worker-secrets
                  key: DATABASE_PASSWORD
            - name: CODERUNTIME_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-worker-secrets
                  key: REDIS_HOST
            - name: CODERUNTIME_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coderuntime.fullname" . }}-worker-secrets
                  key: REDIS_PASSWORD
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.worker.volumes.dockerSocket.enabled }}
            - name: CODERUNTIME_DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            {{- end }}

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

          volumeMounts:
            {{- if .Values.worker.volumes.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if .Values.worker.volumes.sandbox.enabled }}
            - name: sandbox
              mountPath: {{ .Values.worker.config.sandboxBaseDir }}
            {{- end }}
            - name: tmp
              mountPath: /tmp

      volumes:
        {{- if .Values.worker.volumes.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.worker.volumes.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.worker.volumes.sandbox.enabled }}
        - name: sandbox
          hostPath:
            path: {{ .Values.worker.volumes.sandbox.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}

{{/* Helper templates live in _helpers.tpl */}}
