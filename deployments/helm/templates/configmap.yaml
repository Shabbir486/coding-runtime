{{/*
  ConfigMaps for the API gateway and worker. All keys are prefixed with
  CODERUNTIME_ because the Go binary loads env vars via Viper with
  SetEnvPrefix("CODERUNTIME"); unprefixed keys are silently ignored.

  Three ConfigMaps:
    * common-config — settings shared by both api and worker.
    * api-config    — API-gateway-specific.
    * worker-config — worker-specific.
  Both deployments envFrom common-config + their component-specific config.
*/}}

{{- if or .Values.api.enabled .Values.worker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coderuntime.fullname" . }}-common-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared
data:
  CODERUNTIME_DATABASE_PORT: "5432"
  CODERUNTIME_DATABASE_NAME: {{ .Values.postgresql.auth.database | default "coderuntime" | quote }}
  CODERUNTIME_DATABASE_SSL_MODE: "require"
  CODERUNTIME_REDIS_PORT: "6379"
  CODERUNTIME_NATS_URL: "nats://{{ .Release.Name }}-nats:4222"
  CODERUNTIME_LOG_LEVEL: {{ .Values.api.config.logLevel | default "info" | quote }}
  CODERUNTIME_LOG_FORMAT: {{ .Values.api.config.logFormat | default "json" | quote }}
{{- end }}

{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coderuntime.fullname" . }}-api-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  CODERUNTIME_SERVER_PORT: {{ .Values.api.config.serverPort | quote }}
  CODERUNTIME_SERVER_READ_TIMEOUT: {{ .Values.api.config.serverReadTimeout | quote }}
  CODERUNTIME_SERVER_WRITE_TIMEOUT: {{ .Values.api.config.serverWriteTimeout | quote }}
  CODERUNTIME_JWT_ACCESS_TOKEN_EXP: {{ .Values.api.config.jwtExpiry | quote }}
  CODERUNTIME_RATE_LIMIT_LIMIT: {{ .Values.api.config.rateLimitRequests | quote }}
  CODERUNTIME_RATE_LIMIT_PERIOD: {{ .Values.api.config.rateLimitWindow | quote }}
  CODERUNTIME_METRICS_ENABLED: {{ .Values.api.config.metricsEnabled | quote }}
  CODERUNTIME_CORS_ALLOWED_ORIGINS: {{ .Values.api.config.corsAllowedOrigins | quote }}
  CODERUNTIME_TRACING_SERVICE_NAME: api-gateway
{{- end }}

{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coderuntime.fullname" . }}-worker-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
data:
  CODERUNTIME_WORKER_COUNT: {{ .Values.worker.config.workerCount | quote }}
  CODERUNTIME_WORKER_TMP_DIR: {{ .Values.worker.config.sandboxBaseDir | quote }}
  CODERUNTIME_WORKER_JOB_TIMEOUT: {{ .Values.worker.config.executionTimeout | quote }}
  CODERUNTIME_DOCKER_CONTAINER_TIMEOUT: {{ .Values.worker.config.executionTimeout | quote }}
  CODERUNTIME_DOCKER_NETWORK_MODE: {{ if eq (.Values.worker.config.networkDisabled | toString) "true" }}"none"{{ else }}"bridge"{{ end }}
  CODERUNTIME_TRACING_SERVICE_NAME: worker
{{- end }}
