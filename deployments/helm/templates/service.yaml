{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coderuntime.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.api.config.serverPort | quote }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "coderuntime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}

{{- if .Values.worker.enabled }}
---
# Headless service for worker pod discovery (used by Prometheus scrape).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coderuntime.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "coderuntime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
{{- end }}
