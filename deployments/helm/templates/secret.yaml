{{/*
  Application secrets for the API gateway and worker.

  Recommended practice: leave .Values.*.secrets empty in version-controlled
  values, and inject real secret values via Sealed Secrets, External Secrets,
  or Vault. The placeholders below exist so `helm template` renders cleanly
  during CI/CD validation.

  Data values are passed through `b64enc` so callers can supply plain text
  in values.yaml without having to base64-encode by hand.
*/}}

{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coderuntime.fullname" . }}-api-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
data:
  JWT_SECRET: {{ .Values.api.secrets.jwtSecret | default "change-me-in-production-min-32-chars" | b64enc | quote }}
  DATABASE_HOST: {{ printf "%s-postgresql" .Release.Name | b64enc | quote }}
  DATABASE_USER: {{ .Values.postgresql.auth.username | default "coderuntime" | b64enc | quote }}
  DATABASE_PASSWORD: {{ .Values.api.secrets.databasePassword | default .Values.postgresql.auth.password | default "" | b64enc | quote }}
  REDIS_HOST: {{ printf "%s-redis-master" .Release.Name | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.api.secrets.redisPassword | default "" | b64enc | quote }}
{{- end }}

{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coderuntime.fullname" . }}-worker-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coderuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
data:
  DATABASE_HOST: {{ printf "%s-postgresql" .Release.Name | b64enc | quote }}
  DATABASE_USER: {{ .Values.postgresql.auth.username | default "coderuntime" | b64enc | quote }}
  DATABASE_PASSWORD: {{ .Values.api.secrets.databasePassword | default .Values.postgresql.auth.password | default "" | b64enc | quote }}
  REDIS_HOST: {{ printf "%s-redis-master" .Release.Name | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.api.secrets.redisPassword | default "" | b64enc | quote }}
{{- end }}
