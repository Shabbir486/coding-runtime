# =============================================================================
# coderuntime Helm Values
# =============================================================================
# Override with: helm install coderuntime ./deployments/helm -f my-values.yaml
# =============================================================================

global:
  imageRegistry: "ghcr.io"
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: registry-credentials
  storageClass: "fast-ssd"
  # Namespace is set at helm install time: --namespace coderuntime
  namespace: coderuntime

# =============================================================================
# API Gateway
# =============================================================================
api:
  enabled: true
  name: api-gateway
  image:
    repository: ghcr.io/coderuntime/api-gateway
    tag: ""  # Defaults to global.imageTag
    pullPolicy: IfNotPresent

  replicaCount: 3

  service:
    type: ClusterIP
    port: 80
    targetPort: 8002

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: api.coderuntime.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: coderuntime-tls
        hosts:
          - api.coderuntime.io

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  config:
    serverPort: "8002"
    serverReadTimeout: "30s"
    serverWriteTimeout: "30s"
    jwtExpiry: "24h"
    rateLimitRequests: "200"
    rateLimitWindow: "60s"
    logLevel: "info"
    logFormat: "json"
    corsAllowedOrigins: "https://app.coderuntime.io"
    metricsEnabled: "true"

  # Secrets — override with sealed secrets or external-secrets
  secrets:
    # base64-encoded values; use sealed-secrets in production
    jwtSecret: ""
    databasePassword: ""
    redisPassword: ""

  livenessProbe:
    httpGet:
      path: /health
      port: 8002
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8002
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: "/metrics"

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# =============================================================================
# Worker
# =============================================================================
worker:
  enabled: true
  name: worker
  image:
    repository: ghcr.io/coderuntime/worker
    tag: ""  # Defaults to global.imageTag
    pullPolicy: IfNotPresent

  replicaCount: 2

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    targetCPUUtilizationPercentage: 75
    customMetrics:
      natsQueueThreshold: 100
      activeExecutionsPerPod: 8

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  config:
    workerCount: "8"
    sandboxBaseDir: "/tmp/sandbox"
    executionTimeout: "30s"
    maxMemoryMB: "512"
    maxCPUPercent: "100"
    networkDisabled: "true"
    logLevel: "info"
    logFormat: "json"

  runtimeImages:
    python: "ghcr.io/coderuntime/python:3.12"
    nodejs: "ghcr.io/coderuntime/nodejs:22"
    java: "ghcr.io/coderuntime/java:21"
    kotlin: "ghcr.io/coderuntime/kotlin:2.0"
    rust: "ghcr.io/coderuntime/rust:1.82"
    golang: "ghcr.io/coderuntime/golang:1.24"
    cpp: "ghcr.io/coderuntime/cpp:13"
    ruby: "ghcr.io/coderuntime/ruby:3.3"
    swift: "ghcr.io/coderuntime/swift:5.10"
    r: "ghcr.io/coderuntime/r:4.4"

  volumes:
    dockerSocket:
      enabled: true
      hostPath: /var/run/docker.sock
    sandbox:
      enabled: true
      hostPath: /tmp/sandbox

  nodeSelector:
    node-type: compute-optimized

  tolerations: []
  affinity: {}

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    # Host's docker group GID — required so the worker (UID 10001) can write
    # to /var/run/docker.sock. Set to whatever `getent group docker` returns
    # on the worker nodes. Common values: 999 (Debian/Ubuntu), 998 (RHEL).
    dockerGroupGid: 999

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# =============================================================================
# PostgreSQL (Bitnami subchart overrides)
# =============================================================================
postgresql:
  enabled: true
  auth:
    username: coderuntime
    # Override with --set postgresql.auth.password=xxx or use existingSecret
    password: ""
    database: coderuntime
    existingSecret: postgres-secrets
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
  primary:
    persistence:
      enabled: true
      storageClass: fast-ssd
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    configuration: |
      shared_buffers = 512MB
      effective_cache_size = 2GB
      work_mem = 16MB
      max_connections = 200
      log_min_duration_statement = 500
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# =============================================================================
# Redis (Bitnami subchart overrides)
# =============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: redis-secrets
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      enabled: true
      storageClass: fast-ssd
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    configuration: |
      maxmemory 512mb
      maxmemory-policy allkeys-lru
      appendonly yes
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# =============================================================================
# NATS (nats-io subchart overrides)
# =============================================================================
nats:
  enabled: true
  cluster:
    enabled: true
    replicas: 3
  nats:
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 1Gi
      fileStorage:
        enabled: true
        size: 10Gi
        storageClassName: fast-ssd
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
  exporter:
    enabled: true
    serviceMonitor:
      enabled: true

# =============================================================================
# Prometheus (prometheus-community subchart overrides)
# =============================================================================
prometheus:
  enabled: true
  server:
    retention: "30d"
    persistentVolume:
      enabled: true
      storageClass: fast-ssd
      size: 50Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    global:
      scrape_interval: "15s"
      evaluation_interval: "15s"
    extraScrapeConfigs: |
      - job_name: 'coderuntime-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [coderuntime]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
  alertmanager:
    enabled: true
    persistentVolume:
      enabled: true
      size: 5Gi

# =============================================================================
# Grafana (grafana subchart overrides)
# =============================================================================
grafana:
  enabled: true
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: fast-ssd
    size: 5Gi
  grafana.ini:
    server:
      root_url: "https://grafana.coderuntime.io"
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      allow_embedding: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://coderuntime-prometheus-server.coderuntime.svc.cluster.local
          isDefault: true
          access: proxy
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: coderuntime
          orgId: 1
          folder: CodeRuntime
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/coderuntime

# =============================================================================
# Jaeger distributed tracing
# =============================================================================
jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.64.0"
  env:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"
    - name: SPAN_STORAGE_TYPE
      value: badger
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: fast-ssd
    size: 10Gi

# =============================================================================
# ServiceMonitor (for Prometheus Operator)
# =============================================================================
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels:
    release: prometheus
