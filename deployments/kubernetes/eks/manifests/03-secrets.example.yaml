# ---------------------------------------------------------------------------
# SECRETS TEMPLATE — DO NOT COMMIT REAL VALUES.
#
# Copy the values in via `deploy.sh` (which reads them from your environment or
# .env) or `kubectl create secret`. This file documents the exact keys each
# workload expects. The two ecr-registry-auth keys are produced from an ECR
# login token (it expires ~12h — deploy.sh regenerates it).
#
#   stringData is shown for readability; deploy.sh creates these imperatively.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: coderuntime
type: Opaque
stringData:
  DATABASE_HOST: "<rds-endpoint>"
  DATABASE_USER: "<db-user>"
  DATABASE_PASSWORD: "<db-password>"
  JWT_SECRET: "<long-random-string>"
  REDIS_HOST: "redis"
  REDIS_PASSWORD: "<redis-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
  namespace: coderuntime
type: Opaque
stringData:
  DATABASE_HOST: "<rds-endpoint>"
  DATABASE_USER: "<db-user>"
  DATABASE_PASSWORD: "<db-password>"
  REDIS_HOST: "redis"
  REDIS_PASSWORD: "<redis-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: coderuntime
type: Opaque
stringData:
  REDIS_PASSWORD: "<redis-password>"
---
# Lets the worker pull the private code-runtime-* runtime images from ECR.
# CODERUNTIME_DOCKER_REGISTRY = <acct>.dkr.ecr.<region>.amazonaws.com
# CODERUNTIME_DOCKER_REGISTRY_AUTH = base64 X-Registry-Auth JSON (expires ~12h).
apiVersion: v1
kind: Secret
metadata:
  name: ecr-registry-auth
  namespace: coderuntime
type: Opaque
stringData:
  CODERUNTIME_DOCKER_REGISTRY: "<acct>.dkr.ecr.<region>.amazonaws.com"
  CODERUNTIME_DOCKER_REGISTRY_AUTH: "<base64-x-registry-auth>"
