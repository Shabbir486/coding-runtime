apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/version: 1.0.0
  name: api-gateway
  namespace: coderuntime
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: '{{ sha256sum .Values.config }}'
        kubectl.kubernetes.io/restartedAt: '2026-06-23T11:56:17+05:30'
        prometheus.io/path: /metrics
        prometheus.io/port: '8002'
        prometheus.io/scrape: 'true'
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/version: 1.0.0
    spec:
      affinity:
        podAntiAffinity: {}
      automountServiceAccountToken: false
      containers:
      - env:
        - name: CODERUNTIME_DATABASE_HOST
          valueFrom:
            secretKeyRef:
              key: DATABASE_HOST
              name: api-secrets
        - name: CODERUNTIME_DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: DATABASE_USER
              name: api-secrets
        - name: CODERUNTIME_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: api-secrets
        - name: CODERUNTIME_REDIS_HOST
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST
              name: api-secrets
        - name: CODERUNTIME_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: api-secrets
        - name: CODERUNTIME_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: api-secrets
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: api-config
        image: 768054003064.dkr.ecr.ap-southeast-2.amazonaws.com/coderuntime/api:v4
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: api-gateway
        ports:
        - containerPort: 8002
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 15
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      priorityClassName: api-priority
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: api-gateway
      serviceAccountName: api-gateway
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: api-gateway
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: api-gateway
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: '8002'
    prometheus.io/scrape: 'true'
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: api-gateway
  name: api-gateway
  namespace: coderuntime
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: api-gateway
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: '300'
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
  finalizers:
  - service.kubernetes.io/load-balancer-cleanup
  name: api-gateway-lb
  namespace: coderuntime
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8002
  selector:
    app.kubernetes.io/name: api-gateway
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: api-gateway
  name: api-gateway
  namespace: coderuntime
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      selectPolicy: Max
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 3
      - periodSeconds: 60
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 30
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway

