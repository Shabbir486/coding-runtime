---
apiVersion: v1
kind: Namespace
metadata:
  name: coderuntime
  labels:
    name: coderuntime
    app.kubernetes.io/name: coderuntime
    app.kubernetes.io/managed-by: kubectl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Service account for the API gateway
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: api
automountServiceAccountToken: false

---
# Service account for workers (needs Docker socket access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
automountServiceAccountToken: false

---
# Service account for monitoring
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
automountServiceAccountToken: true

---
# ClusterRole that allows Prometheus to scrape pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coderuntime-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coderuntime-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coderuntime-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: coderuntime

---
# Role for worker to read configmaps (for runtime image references)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-role
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["worker-config"]
    verbs: ["get", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-role-binding
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-role
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: coderuntime

---
# ResourceQuota for the entire namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: coderuntime-quota
  namespace: coderuntime
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "80"
    limits.memory: "160Gi"
    pods: "100"
    services: "20"
    persistentvolumeclaims: "10"
    secrets: "50"
    configmaps: "50"

---
# LimitRange for default pod resource bounds
apiVersion: v1
kind: LimitRange
metadata:
  name: coderuntime-limits
  namespace: coderuntime
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
    - type: Pod
      max:
        cpu: "8"
        memory: "16Gi"
    - type: PersistentVolumeClaim
      max:
        storage: "100Gi"
      min:
        storage: "1Gi"

---
# NetworkPolicy: allow intra-namespace + ingress from ingress-controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-external
  namespace: coderuntime
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: coderuntime
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: coderuntime
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS (image pulls, external OAuth, etc.)
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# PriorityClass for worker pods
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: worker-priority
value: 500000
globalDefault: false
description: "Priority for code execution worker pods"

---
# PriorityClass for API pods
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: api-priority
value: 750000
globalDefault: false
description: "Priority for API gateway pods"
