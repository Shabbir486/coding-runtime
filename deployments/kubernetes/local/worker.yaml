---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      priorityClassName: worker-priority

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # supplementalGroups MUST include the host's docker group GID so the
        # worker (UID 10001) can write to /var/run/docker.sock. Set this to
        # whatever `getent group docker | cut -d: -f3` returns on the worker
        # nodes — common values: 999 (Debian/Ubuntu), 998 (RHEL/CentOS).
        # If the GID differs across nodes, add each one to the list.
        # 0 (root) + 999: the host docker.sock passed through kind is root-owned,
        # so the worker (UID 10001) needs group root to write to it locally.
        supplementalGroups:
          - 0
          - 999
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: worker
                topologyKey: kubernetes.io/hostname
        # Prefer nodes with more CPU for code execution
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - compute-optimized

      terminationGracePeriodSeconds: 120

      # No imagePullSecrets: EKS nodes pull from ECR via their IAM role.

      initContainers:
        # Ensure sandbox directory exists with correct permissions
        - name: init-sandbox
          image: busybox:1.36-musl
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/sandbox
              chmod 1777 /tmp/sandbox
              echo "Sandbox directory ready"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: sandbox
              mountPath: /tmp/sandbox

      containers:
        - name: worker
          image: ghcr.io/coderuntime/worker:latest
          imagePullPolicy: IfNotPresent  # LOCAL: use the image loaded into kind
          ports:
            - name: metrics
              containerPort: 8085
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: worker-config
            # LOCAL: AWS keys for the SQS consumer (no IRSA on kind). The SDK
            # default chain reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
            - secretRef:
                name: aws-credentials
          # Env var names are prefixed with CODERUNTIME_ so Viper picks them up
          # (binary uses SetEnvPrefix("CODERUNTIME")). Secret data keys remain
          # short — only the env var name in the pod matters.
          env:
            - name: CODERUNTIME_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_HOST
            - name: CODERUNTIME_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_USER
            - name: CODERUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_PASSWORD
            - name: CODERUNTIME_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: REDIS_HOST
            - name: CODERUNTIME_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: REDIS_PASSWORD
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Docker-in-Docker via socket
            - name: CODERUNTIME_DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            # SQS credentials: on EKS these come from IRSA (the worker
            # ServiceAccount is annotated with an IAM role; the AWS SDK reads the
            # OIDC web-identity token automatically — no static keys). For a
            # non-EKS/local target, inject AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
            # here from an aws-credentials Secret instead.

          resources:
            # The worker process only orchestrates (token lookups, result writes);
            # the dind sidecar runs the CPU-heavy sandboxes. Keep the worker light
            # so it doesn't steal cores from dind on a 2-vCPU node.
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                # Drain in-flight jobs before SIGTERM
                command: ["/bin/sh", "-c", "sleep 15"]

          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: sandbox
              mountPath: /tmp/sandbox
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: sandbox
          hostPath:
            path: /tmp/sandbox
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8085"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 8085
      targetPort: metrics
      protocol: TCP

---
# Worker autoscaling is handled by KEDA on SQS backlog — see
# keda-worker-scaledobject.yaml. A plain HorizontalPodAutoscaler is intentionally
# NOT defined here: the worker offloads all CPU to sibling Docker sandbox
# containers (Docker-out-of-Docker), so the worker pod stays near-idle and a
# CPU/memory HPA would never scale it. Queue depth is the only meaningful signal.
# (Do not add an HPA targeting this Deployment — it would conflict with the HPA
# KEDA generates, "keda-hpa-worker".)

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
