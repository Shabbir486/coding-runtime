---
# Settings shared by both the API gateway and worker. Mounted via envFrom in
# both deployments. Keys must be prefixed with CODERUNTIME_ because the Go
# binary loads env vars through Viper with SetEnvPrefix("CODERUNTIME");
# unprefixed keys are silently ignored.
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: coderuntime
    app.kubernetes.io/component: shared
data:
  CODERUNTIME_DATABASE_PORT: "5432"
  CODERUNTIME_DATABASE_NAME: "coderuntime"
  CODERUNTIME_DATABASE_SSL_MODE: "require"
  CODERUNTIME_REDIS_PORT: "6379"
  CODERUNTIME_NATS_URL: "nats://nats:4222"
  CODERUNTIME_LOG_LEVEL: "info"
  CODERUNTIME_LOG_FORMAT: "json"

---
# API-gateway-specific settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: api
data:
  CODERUNTIME_SERVER_PORT: "8002"
  CODERUNTIME_SERVER_READ_TIMEOUT: "30s"
  CODERUNTIME_SERVER_WRITE_TIMEOUT: "30s"
  CODERUNTIME_SERVER_IDLE_TIMEOUT: "120s"

  CODERUNTIME_DATABASE_MAX_OPEN_CONNS: "50"
  CODERUNTIME_DATABASE_MAX_IDLE_CONNS: "10"
  CODERUNTIME_DATABASE_CONN_MAX_LIFETIME: "300s"

  CODERUNTIME_REDIS_DB: "0"

  CODERUNTIME_JWT_ACCESS_TOKEN_EXP: "24h"
  CODERUNTIME_RATE_LIMIT_LIMIT: "200"
  CODERUNTIME_RATE_LIMIT_PERIOD: "60s"

  CODERUNTIME_METRICS_ENABLED: "true"
  CODERUNTIME_TRACING_SERVICE_NAME: "api-gateway"

  CODERUNTIME_CORS_ALLOWED_ORIGINS: "https://app.coderuntime.io"
  CODERUNTIME_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CODERUNTIME_CORS_MAX_AGE: "86400"

---
# Worker-specific settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
data:
  CODERUNTIME_WORKER_COUNT: "8"
  CODERUNTIME_WORKER_TMP_DIR: "/tmp/sandbox"
  CODERUNTIME_WORKER_JOB_TIMEOUT: "30s"
  CODERUNTIME_DOCKER_CONTAINER_TIMEOUT: "30s"
  CODERUNTIME_DOCKER_NETWORK_MODE: "none"

  CODERUNTIME_TRACING_SERVICE_NAME: "worker"

---
# PostgreSQL server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  POSTGRES_DB: "coderuntime"
  postgresql.conf: |
    # Memory
    shared_buffers = 512MB
    effective_cache_size = 2GB
    work_mem = 16MB
    maintenance_work_mem = 128MB
    wal_buffers = 16MB

    # Checkpoint
    checkpoint_completion_target = 0.9
    max_wal_size = 2GB
    min_wal_size = 256MB

    # Connections
    max_connections = 200
    superuser_reserved_connections = 3

    # Query planner
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200

    # Logging
    log_min_duration_statement = 500
    log_checkpoints = on
    log_connections = off
    log_disconnections = off
    log_lock_waits = on

    # Replication (ready for streaming replication)
    wal_level = replica
    max_wal_senders = 3
    wal_keep_size = 128MB

    # Locale
    datestyle = 'iso, mdy'
    timezone = 'UTC'
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    replication     replicator      10.0.0.0/8              scram-sha-256

---
# Redis configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 300
    tcp-keepalive 60

    # General
    daemonize no
    loglevel notice
    databases 16

    # Snapshotting
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data

    # Replication
    replica-serve-stale-data yes
    replica-read-only yes

    # Append only file
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb

    # Memory
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    maxmemory-samples 5

    # Lazy freeing
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes

    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128

---
# NATS configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
data:
  nats.conf: |
    # Client port
    port: 4222

    # HTTP monitoring port
    http_port: 8222

    # Logging
    logtime: false
    debug: false
    trace: false

    # Connection settings
    max_connections: 10000
    max_payload: 8MB
    max_pending: 64MB
    ping_interval: "2m"
    max_pings_out: 2
    write_deadline: "10s"

    # JetStream
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 1GB
      max_file_store: 10GB
    }

    # Cluster configuration (for 3-node HA)
    cluster {
      name: coderuntime
      port: 6222
      routes: [
        nats-route://nats-0.nats-headless.coderuntime.svc.cluster.local:6222
        nats-route://nats-1.nats-headless.coderuntime.svc.cluster.local:6222
        nats-route://nats-2.nats-headless.coderuntime.svc.cluster.local:6222
      ]
    }
