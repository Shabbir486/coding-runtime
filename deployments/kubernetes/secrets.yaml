---
# IMPORTANT: This file contains SECRET TEMPLATES with placeholder values.
# Before deploying:
#   1. Replace all <PLACEHOLDER_*> values with real base64-encoded secrets.
#   2. Consider using Sealed Secrets, Vault, or External Secrets Operator instead.
#   3. NEVER commit real secrets to version control.
#
# To base64-encode a value:
#   echo -n "your-secret-value" | base64
#
# To generate a strong JWT secret:
#   openssl rand -base64 64 | tr -d '\n' | base64

apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: api
  annotations:
    # Rotate every 90 days
    secret-rotation-period: "90d"
type: Opaque
data:
  # echo -n "your-jwt-secret-min-64-chars" | base64
  JWT_SECRET: <PLACEHOLDER_BASE64_JWT_SECRET>
  # echo -n "your-database-password" | base64
  DATABASE_PASSWORD: <PLACEHOLDER_BASE64_DB_PASSWORD>
  # echo -n "your-redis-password" | base64
  REDIS_PASSWORD: <PLACEHOLDER_BASE64_REDIS_PASSWORD>
  # echo -n "your-database-user" | base64
  DATABASE_USER: <PLACEHOLDER_BASE64_DB_USER>
  # echo -n "your-database-host" | base64
  DATABASE_HOST: <PLACEHOLDER_BASE64_DB_HOST>
  # echo -n "your-redis-host" | base64
  REDIS_HOST: <PLACEHOLDER_BASE64_REDIS_HOST>

---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
type: Opaque
data:
  DATABASE_PASSWORD: <PLACEHOLDER_BASE64_DB_PASSWORD>
  DATABASE_USER: <PLACEHOLDER_BASE64_DB_USER>
  DATABASE_HOST: <PLACEHOLDER_BASE64_DB_HOST>
  REDIS_PASSWORD: <PLACEHOLDER_BASE64_REDIS_PASSWORD>
  REDIS_HOST: <PLACEHOLDER_BASE64_REDIS_HOST>

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
data:
  # echo -n "coderuntime" | base64
  POSTGRES_USER: <PLACEHOLDER_BASE64_POSTGRES_USER>
  # echo -n "your-strong-postgres-password" | base64
  POSTGRES_PASSWORD: <PLACEHOLDER_BASE64_POSTGRES_PASSWORD>
  # echo -n "replicator" | base64
  REPLICATION_USER: <PLACEHOLDER_BASE64_REPLICATION_USER>
  # echo -n "your-replication-password" | base64
  REPLICATION_PASSWORD: <PLACEHOLDER_BASE64_REPLICATION_PASSWORD>

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
type: Opaque
data:
  # echo -n "your-redis-password" | base64
  REDIS_PASSWORD: <PLACEHOLDER_BASE64_REDIS_PASSWORD>

---
# TLS certificate for ingress (replace with cert-manager annotation or real cert)
apiVersion: v1
kind: Secret
metadata:
  name: coderuntime-tls
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: coderuntime
    app.kubernetes.io/component: tls
  annotations:
    # If using cert-manager, remove this secret and use the annotation on Ingress instead:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/managed: "true"
type: kubernetes.io/tls
data:
  # base64-encoded PEM certificate
  tls.crt: <PLACEHOLDER_BASE64_TLS_CERT>
  # base64-encoded PEM private key
  tls.key: <PLACEHOLDER_BASE64_TLS_KEY>

---
# Container registry pull secret (for private registry)
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: coderuntime
    app.kubernetes.io/component: registry
  annotations:
    # To create from docker config:
    # kubectl create secret docker-registry registry-credentials \
    #   --docker-server=ghcr.io \
    #   --docker-username=<user> \
    #   --docker-password=<pat> \
    #   --namespace=coderuntime
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <PLACEHOLDER_BASE64_DOCKER_CONFIG_JSON>

---
# Grafana admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  # echo -n "admin" | base64
  admin-user: <PLACEHOLDER_BASE64_GRAFANA_USER>
  # echo -n "your-strong-grafana-password" | base64
  admin-password: <PLACEHOLDER_BASE64_GRAFANA_PASSWORD>
