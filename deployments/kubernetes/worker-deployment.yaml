---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      priorityClassName: worker-priority

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # supplementalGroups MUST include the host's docker group GID so the
        # worker (UID 10001) can write to /var/run/docker.sock. Set this to
        # whatever `getent group docker | cut -d: -f3` returns on the worker
        # nodes — common values: 999 (Debian/Ubuntu), 998 (RHEL/CentOS).
        # If the GID differs across nodes, add each one to the list.
        supplementalGroups:
          - 999
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: worker
                topologyKey: kubernetes.io/hostname
        # Prefer nodes with more CPU for code execution
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - compute-optimized

      terminationGracePeriodSeconds: 120

      imagePullSecrets:
        - name: registry-credentials

      initContainers:
        # Ensure sandbox directory exists with correct permissions
        - name: init-sandbox
          image: busybox:1.36-musl
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/sandbox
              chmod 1777 /tmp/sandbox
              echo "Sandbox directory ready"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: sandbox
              mountPath: /tmp/sandbox

      containers:
        - name: worker
          image: ghcr.io/coderuntime/worker:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: worker-config
          # Env var names are prefixed with CODERUNTIME_ so Viper picks them up
          # (binary uses SetEnvPrefix("CODERUNTIME")). Secret data keys remain
          # short — only the env var name in the pod matters.
          env:
            - name: CODERUNTIME_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_HOST
            - name: CODERUNTIME_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_USER
            - name: CODERUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_PASSWORD
            - name: CODERUNTIME_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: REDIS_HOST
            - name: CODERUNTIME_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: REDIS_PASSWORD
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Docker-in-Docker via socket
            - name: CODERUNTIME_DOCKER_HOST
              value: "unix:///var/run/docker.sock"

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                # Drain in-flight jobs before SIGTERM
                command: ["/bin/sh", "-c", "sleep 15"]

          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: sandbox
              mountPath: /tmp/sandbox
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: sandbox
          hostPath:
            path: /tmp/sandbox
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP

---
# Custom Metrics-based HPA (requires Prometheus Adapter)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric: NATS queue size > 100 triggers scale-up
    - type: Pods
      pods:
        metric:
          name: nats_queue_size
        target:
          type: AverageValue
          averageValue: "100"
    # Active execution count per pod
    - type: Pods
      pods:
        metric:
          name: worker_active_executions
        target:
          type: AverageValue
          averageValue: "8"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 5
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: coderuntime
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
