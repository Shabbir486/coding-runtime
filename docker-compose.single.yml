version: '3.9'

# Single-node overrides tuned for a small AWS box (e.g. m7i-flex.large, 2 vCPU / 8 GB).
#
# Layers on top of the base dev compose (NOT the swarm prod file):
#   docker compose -f docker-compose.yml -f docker-compose.single.yml up -d
#
# Goals vs. docker-compose.prod.yml:
#   - One api + one worker (no swarm replicas) so it fits 2 vCPU.
#   - WORKER_COUNT trimmed 8 -> 2 so at most 2 untrusted-code sandboxes run at
#     once; 4 workers x 8 = 32 concurrent containers is what OOMs an 8 GB host.
#   - Hard CPU/memory limits on every service so no single one starves the box.
#   - Observability stack (prometheus/grafana/jaeger) kept minimal; comment the
#     blocks out entirely if you only need the API + workers.
#
# For real load, move postgres/redis to RDS/ElastiCache and point the api/worker
# env at them (see docker-compose.prod.yml) instead of running them on-box.

services:
  api:
    environment:
      # The api also carries a worker pool (WORKER_COUNT=4 in the base file);
      # trim it so the gateway can't spin up extra sandboxes on a small box.
      - CODERUNTIME_WORKER_COUNT=2
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 96M

  queue-manager:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 48M

  worker:
    environment:
      # Cap concurrent sandbox containers. This is the single most important
      # knob for fitting an 8 GB box — each sandbox is a sibling container.
      - CODERUNTIME_WORKER_COUNT=2
      # On-demand image pulls: missing code-runtime-* images are pulled from
      # this registry and re-tagged locally. Leave REGISTRY unset to disable.
      # REGISTRY_AUTH is the base64 X-Registry-Auth for a private registry
      # (e.g. ECR) — generate it with scripts/ecr-refresh-auth.sh.
      - CODERUNTIME_DOCKER_REGISTRY=${REGISTRY:-}
      - CODERUNTIME_DOCKER_REGISTRY_AUTH=${REGISTRY_AUTH:-}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M

  redis:
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly yes
        --appendfsync everysec
        --loglevel warning
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 320M
        reservations:
          cpus: '0.05'
          memory: 64M

  nats:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M

  # ── Observability — trimmed. Comment out to reclaim ~1.5 GB on a tight box. ──
  prometheus:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M

  grafana:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M

  jaeger:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M
