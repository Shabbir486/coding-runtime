
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8002:8002"
    environment:
      - CODERUNTIME_DATABASE_HOST=postgres
      - CODERUNTIME_DATABASE_PORT=5432
      - CODERUNTIME_DATABASE_USER=coderuntime
      - CODERUNTIME_DATABASE_PASSWORD=coderuntime123
      - CODERUNTIME_DATABASE_NAME=coderuntime
      - CODERUNTIME_DATABASE_SSL_MODE=disable
      - CODERUNTIME_DATABASE_MAX_OPEN_CONNS=25
      - CODERUNTIME_DATABASE_MAX_IDLE_CONNS=5
      - CODERUNTIME_DATABASE_CONN_MAX_LIFETIME=5m
      - CODERUNTIME_REDIS_HOST=redis
      - CODERUNTIME_REDIS_PORT=6379
      - CODERUNTIME_REDIS_DB=0
      - CODERUNTIME_REDIS_PASSWORD=
      - CODERUNTIME_NATS_URL=nats://nats:4222
      - CODERUNTIME_JWT_SECRET=dev-secret-change-in-prod
      - CODERUNTIME_JWT_ACCESS_TOKEN_EXP=24h
      - CODERUNTIME_SERVER_PORT=8002
      - CODERUNTIME_SERVER_READ_TIMEOUT=30s
      - CODERUNTIME_SERVER_WRITE_TIMEOUT=30s
      - CODERUNTIME_SERVER_IDLE_TIMEOUT=120s
      - CODERUNTIME_RATE_LIMIT_LIMIT=100
      - CODERUNTIME_RATE_LIMIT_PERIOD=1m
      - CODERUNTIME_METRICS_ENABLED=true
      - CODERUNTIME_TRACING_ENABLED=true
      - CODERUNTIME_TRACING_ENDPOINT=http://jaeger:4318
      - CODERUNTIME_TRACING_SERVICE_NAME=api-gateway
      - CODERUNTIME_WORKER_COUNT=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      # queue-manager owns stream topology; api must not publish before it has
      # created the streams.
      queue-manager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - coderuntime

  queue-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.queue-manager
    environment:
      - CODERUNTIME_DATABASE_HOST=postgres
      - CODERUNTIME_DATABASE_PORT=5432
      - CODERUNTIME_DATABASE_USER=coderuntime
      - CODERUNTIME_DATABASE_PASSWORD=coderuntime123
      - CODERUNTIME_DATABASE_NAME=coderuntime
      - CODERUNTIME_DATABASE_SSL_MODE=disable
      - CODERUNTIME_NATS_URL=nats://nats:4222
      - CODERUNTIME_METRICS_ENABLED=true
      - CODERUNTIME_TRACING_SERVICE_NAME=queue-manager
      - QUEUE_MANAGER_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - coderuntime

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - CODERUNTIME_DATABASE_HOST=postgres
      - CODERUNTIME_DATABASE_PORT=5432
      - CODERUNTIME_DATABASE_USER=coderuntime
      - CODERUNTIME_DATABASE_PASSWORD=coderuntime123
      - CODERUNTIME_DATABASE_NAME=coderuntime
      - CODERUNTIME_DATABASE_SSL_MODE=disable
      - CODERUNTIME_REDIS_HOST=redis
      - CODERUNTIME_REDIS_PORT=6379
      - CODERUNTIME_NATS_URL=nats://nats:4222
      - CODERUNTIME_WORKER_COUNT=4
      - CODERUNTIME_WORKER_CONCURRENCY=4
      - CODERUNTIME_DOCKER_HOST=unix:///var/run/docker.sock
      - CODERUNTIME_WORKER_TMP_DIR=/tmp/sandbox
      - CODERUNTIME_WORKER_JOB_TIMEOUT=30s
      - CODERUNTIME_DOCKER_CONTAINER_TIMEOUT=30s
      - CODERUNTIME_DOCKER_NETWORK_MODE=none
      - CODERUNTIME_TRACING_ENABLED=true
      - CODERUNTIME_TRACING_ENDPOINT=http://jaeger:4317
      - CODERUNTIME_TRACING_SERVICE_NAME=worker
      - GODEBUG=asyncpreemptoff=1
    user: "root"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/sandbox:/tmp/sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - coderuntime
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coderuntime
      POSTGRES_PASSWORD: coderuntime123
      POSTGRES_DB: coderuntime
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderuntime -d coderuntime"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "5432:5432"
    networks:
      - coderuntime
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --save 300 100
        --save 900 1
        --loglevel warning
        --bind 0.0.0.0
        --protected-mode no
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - coderuntime

  nats:
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-m"
      - "8222"
      - "-n"
      - "coderuntime-1"
      - "-sd"
      - "/data/jetstream"
    volumes:
      - nats_data:/data/jetstream
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - coderuntime

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - coderuntime

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployments/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - coderuntime

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coderuntime

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  coderuntime:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
